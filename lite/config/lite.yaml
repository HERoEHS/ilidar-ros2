ilidar_lite_core:
  ros__parameters:
    broadcast_ip: ""
    listening_ip: ""
    listening_port: 7256

    # Common defaults for every discovered sensor. Topics and child frames are
    # generated from the third octet of the sensor IP address, so a sensor at
    # 10.0.97.2 is identified as 97: /ilidar_lite_97, ilidar_lite_97_link, and
    # ilidar_lite_97_optical_frame. Replacing a sensor keeps the same names as
    # long as the replacement reuses the address.
    parent_frame_id: base_link
    publish_tf: true

    # TODO(json@hybo.co): Measure the product mounting offset and update this
    # base_link -> ilidar_lite_link transform.
    mount_translation_x: 0.0
    mount_translation_y: 0.0
    mount_translation_z: 0.0
    mount_rotation_roll: 0.0
    mount_rotation_pitch: 0.0
    mount_rotation_yaw: 0.0

    # The link-to-optical rotation follows the ROS optical-frame convention:
    # link (forward, left, up) -> optical (right, down, forward).
    # TODO(json@hybo.co): Measure only the optical translation offset.
    optical_translation_x: 0.0
    optical_translation_y: 0.0
    optical_translation_z: 0.0
    optical_rotation_roll: -1.5707963267948966
    optical_rotation_pitch: 0.0
    optical_rotation_yaw: -1.5707963267948966

    publish_depth: true
    publish_amplitude: true
    publish_intensity: true
    publish_confidence: true
    publish_depth_color: true
    publish_intensity_color: true
    publish_amplitude_color: false
    publish_camera_info: true
    publish_pointcloud: true
    publish_pointcloud_amplitude: true
    publish_info: true
    publish_diagnostics: true

    sensor_qos_depth: 5
    diagnostics_qos_depth: 10

    # Optional per-sensor overrides keyed by ilidar_lite_<third IP octet>.
    # Missing entries inherit the common values above; link_frame_id and
    # frame_id retain their address-derived defaults. All parameters are fixed
    # after startup; edit this file and restart the node.
    # Units: meters. 10.0.99.x -> left, 10.0.97.x -> right.
    devices:
      ilidar_lite_99:
        topic_prefix: /ilidar_lite_left
        link_frame_id: ilidar_lite_left_link
        frame_id: ilidar_lite_left_optical_frame
        mount_translation_x: -0.40
        mount_translation_y: 0.22
        mount_translation_z: 0.1
        mount_rotation_roll: 3.141592653589793
        # mount_rotation_pitch: -1.5707963267948966
        mount_rotation_yaw: 0.959931
        
      ilidar_lite_97:
        topic_prefix: /ilidar_lite_right
        link_frame_id: ilidar_lite_right_link
        frame_id: ilidar_lite_right_optical_frame
        mount_translation_x: -0.40
        mount_translation_y: -0.22
        mount_translation_z: 0.1
        mount_rotation_yaw: -0.959931
